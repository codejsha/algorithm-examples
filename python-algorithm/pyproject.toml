[project]
name = "algorithm"
version = "1.0.0"
description = "Algorithm examples in Python"
authors = [{ name = "Jinseong Ha" }]
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "scipy>=1.14.0,<2.0.0",
    "networkx>=3.3,<4.0",
    "matplotlib>=3.9.0,<4.0.0",
]

[project.urls]
repository = "https://github.com/codejsha/algorithm-examples"

[dependency-groups]
test = [
    "pytest>=8.2.2,<9.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algorithm"]
